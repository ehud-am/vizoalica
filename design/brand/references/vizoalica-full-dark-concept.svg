  <circle cx="67" cy="119" r="13" fill="#12c5e8" stroke="#10141c" stroke-width="5"/>
  <circle cx="126" cy="78" r="14" fill="#793dff"/>
  <circle cx="169" cy="33" r="15" fill="#12c5e8"/>

