name: Docs site

# Builds and checks the documentation site (docs/) on every change to it, and publishes it to
# Cloudflare Pages (vizoalica.dev) from the main branch once the one-time setup in
# docs/operations/docs-site.md has been done. Until then the publish job is skipped, not failed.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'llms.txt'
      - 'apps/admin-web/public/brand/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'llms.txt'
      - 'apps/admin-web/public/brand/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

# The build needs to read the repository and nothing else. The publish job adds nothing to this: it
# authenticates to Cloudflare with its own token, not with the workflow's GitHub token.
permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  # A newer pull request run replaces an older one, but a publish in progress is never cut short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install the site's locked dependencies
        run: pnpm install --frozen-lockfile --filter @vizoalica/docs

      # A placeholder endpoint and website key turn the analytics control and the extra
      # Content-Security-Policy entry on, so the checks below cover them. Nothing is sent anywhere:
      # this build has no SDK, so the page's request for it fails (the tests that need it stub it).
      - name: Build the site
        env:
          VIZOALICA_INGEST_ENDPOINT: https://ingest.example.test/v1/events:batch
          VIZOALICA_WEBSITE_KEY: placeholder-website-key
        run: pnpm docs:build

      - name: Install Chromium
        run: pnpm --filter @vizoalica/docs exec playwright install --with-deps chromium

      - name: Check the built site (accessibility, headers, no third-party requests, search)
        run: pnpm docs:test

      - name: Say whether publishing is set up
        if: github.event_name != 'pull_request'
        env:
          PAGES_PROJECT: ${{ vars.VIZOALICA_DOCS_PAGES_PROJECT }}
        run: |
          if [ -z "$PAGES_PROJECT" ]; then
            echo "::notice title=Docs not published::The site built and passed its checks, but publishing is not set up. Follow docs/operations/docs-site.md."
          fi

  publish:
    name: Publish to Cloudflare Pages
    needs: build
    # Only from the main branch of this repository, never for a pull request (so never for a fork),
    # and only once the maintainer has named the Pages project.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.VIZOALICA_DOCS_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A named environment lets the maintainer require approval or restrict the branch (see the guide).
    environment: docs-production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable the pinned package manager
        run: corepack enable

      # The repository's own locked Wrangler is used, so no unpinned tool touches the token.
      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile --filter . --filter @vizoalica/docs

      # Built again here, from this exact commit, rather than passed between jobs. The endpoint and
      # website key are public (set as variables; a secret of the same name also works; the old name VIZOALICA_PUBLIC_SOURCE_KEY is still read). When either is
      # not set the site is built and published without analytics.
      - name: Build the site
        env:
          VIZOALICA_INGEST_ENDPOINT: ${{ vars.VIZOALICA_INGEST_ENDPOINT || secrets.VIZOALICA_INGEST_ENDPOINT }}
          VIZOALICA_WEBSITE_KEY: ${{ vars.VIZOALICA_WEBSITE_KEY || secrets.VIZOALICA_WEBSITE_KEY || vars.VIZOALICA_PUBLIC_SOURCE_KEY || secrets.VIZOALICA_PUBLIC_SOURCE_KEY }}
        run: pnpm docs:build

      - name: Build the browser SDK
        run: pnpm browser-sdk:build

      # Adds the SDK beside the pages. The site sends unsigned events (data-token-url="none"), so there
      # is no token endpoint, no Pages Function and no signing secret. Only public values.
      - name: Add Vizoalica analytics
        env:
          VIZOALICA_INGEST_ENDPOINT: ${{ vars.VIZOALICA_INGEST_ENDPOINT || secrets.VIZOALICA_INGEST_ENDPOINT }}
          VIZOALICA_WEBSITE_KEY: ${{ vars.VIZOALICA_WEBSITE_KEY || secrets.VIZOALICA_WEBSITE_KEY || vars.VIZOALICA_PUBLIC_SOURCE_KEY || secrets.VIZOALICA_PUBLIC_SOURCE_KEY }}
        run: node docs/scripts/prepare-analytics.mjs

      # The Cloudflare token exists only in this step's environment.
      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DOCS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.VIZOALICA_DOCS_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          pnpm exec wrangler pages deploy .vitepress/dist --cwd docs \
            --project-name "$PAGES_PROJECT" --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "docs: publish $GITHUB_SHA"
