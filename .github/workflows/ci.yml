name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan the history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks reads the pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Free for repositories owned by a personal account; an organization needs GITLEAKS_LICENSE.
      - name: Scan with gitleaks (.gitleaks.toml)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  verify:
    name: Verify and browser-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable the pinned package manager
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # First, on a clean tree, exactly as publish.yml does: once `pnpm build` has compiled the workspace
      # packages, a bundle that only works against their dist/ would pass here and fail to publish.
      - name: Build the standalone browser SDK
        run: pnpm browser-sdk:build

      # The publish workflow installs the latest npm before packing; npm 12 changed the shape of
      # `npm pack --json`, which this check tripped over only at release time. Do the same here.
      - name: Use the latest npm, as the publish workflow does
        run: npm install --global npm@latest

      # Packs what npm would publish, installs it into an empty prefix and home, and starts the console from it.
      - name: Build and check the npm package
        run: pnpm package:build && pnpm package:check

      # Then, still before anything else: the later type-check emits dist and would hide a broken build order.
      - name: Build production packages
        run: pnpm build

      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@320fcdd9c860767cf17fab3b20e22e739d5d02b8 # v1.76.0
        with:
          fail_level: error

      - name: Check the deploy workflow's embedded Functions are up to date
        run: pnpm run generate:deploy-workflow:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Enforce coverage thresholds
        run: pnpm coverage

      - name: Install Chromium
        run: pnpm --filter @vizoalica/admin-web exec playwright install --with-deps chromium

      - name: Run responsive and accessibility browser tests
        run: pnpm test:e2e

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
