name: Deploy Vizoalica website

# Reusable workflow a Vizoalica customer's own website repository calls to
# publish their site to their own Cloudflare Pages project, along with the
# Vizoalica configuration and token-issuing Pages Functions, on every push to
# their configured site path. See:
# specs/011-quality-simplicity-release/contracts/deploy-workflow-contract.md
#
# Caller example (in the customer's own repo):
#
#   jobs:
#     deploy:
#       uses: ehud-am/vizoalica/.github/workflows/deploy-vizoalica-pages.yml@v0.5.2
#       with:
#         site-directory: docs
#       secrets: inherit
#
# Required caller repository variables: VIZOALICA_SDK_SRC,
# VIZOALICA_INGEST_ENDPOINT, VIZOALICA_PUBLIC_SOURCE_KEY, VIZOALICA_PROJECT_ID,
# VIZOALICA_TOKEN_URL, VIZOALICA_CONSENT, VIZOALICA_SOURCE_ID,
# VIZOALICA_SITE_ORIGIN, CF_ACCOUNT_ID, CF_PAGES_PROJECT.
# Required caller repository secrets: CF_API_TOKEN (Cloudflare Pages: Edit
# scope only), VIZOALICA_TOKEN_SECRET (>= 32 random characters).
#
# None of these values are ever read from, or written to, the caller's
# repository source. They are supplied by GitHub Actions and wired into the
# Cloudflare Pages environment for this deployment only.

on:
  workflow_call:
    inputs:
      site-directory:
        description: Path, relative to the caller repository root, of the static site to deploy.
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate required configuration
        env:
          VIZOALICA_SDK_SRC: ${{ vars.VIZOALICA_SDK_SRC }}
          VIZOALICA_INGEST_ENDPOINT: ${{ vars.VIZOALICA_INGEST_ENDPOINT }}
          VIZOALICA_PUBLIC_SOURCE_KEY: ${{ vars.VIZOALICA_PUBLIC_SOURCE_KEY }}
          VIZOALICA_PROJECT_ID: ${{ vars.VIZOALICA_PROJECT_ID }}
          VIZOALICA_TOKEN_URL: ${{ vars.VIZOALICA_TOKEN_URL }}
          VIZOALICA_CONSENT: ${{ vars.VIZOALICA_CONSENT }}
          VIZOALICA_SOURCE_ID: ${{ vars.VIZOALICA_SOURCE_ID }}
          VIZOALICA_SITE_ORIGIN: ${{ vars.VIZOALICA_SITE_ORIGIN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VIZOALICA_TOKEN_SECRET: ${{ secrets.VIZOALICA_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          for name in VIZOALICA_SDK_SRC VIZOALICA_INGEST_ENDPOINT VIZOALICA_PUBLIC_SOURCE_KEY \
            VIZOALICA_PROJECT_ID VIZOALICA_TOKEN_URL VIZOALICA_CONSENT VIZOALICA_SOURCE_ID \
            VIZOALICA_SITE_ORIGIN CF_ACCOUNT_ID CF_PAGES_PROJECT CF_API_TOKEN \
            VIZOALICA_TOKEN_SECRET; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#VIZOALICA_TOKEN_SECRET}" -lt 32 ] 2>/dev/null; then
            echo "::error::VIZOALICA_TOKEN_SECRET must be at least 32 characters"
            exit 1
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repository variables/secrets: ${missing[*]}"
            echo "See specs/011-quality-simplicity-release/contracts/deploy-workflow-contract.md" \
              "in ehud-am/vizoalica for the full list, or the admin console's website page."
            exit 1
          fi
          if [ ! -d "${{ inputs.site-directory }}" ]; then
            echo "::error::site-directory '${{ inputs.site-directory }}' does not exist in this repository"
            exit 1
          fi

      - name: Write vendored Vizoalica Pages Functions and loader
        # A reusable workflow's GITHUB_TOKEN never carries cross-repo access
        # to check out this (private) repository from the caller's job, even
        # with the reusable-workflow "access_level: user" permission granted
        # (that setting only controls which repos may resolve this
        # workflow_call, not what actions/checkout can read). So these three
        # small files are embedded here instead, kept in sync with their real
        # source under examples/cloudflare-pages/ by
        # `pnpm run generate:deploy-workflow` (enforced in CI).
        env:
          # BEGIN GENERATED: pnpm run generate:deploy-workflow
          CONFIG_JSON_TS_B64: 
          INGEST_TOKEN_TS_B64: 
          VIZOALICA_LOADER_JS_B64: 
          # END GENERATED
        run: |
          set -euo pipefail
          site="${{ inputs.site-directory }}"
          mkdir -p "$site/functions/vizoalica"
          echo "$CONFIG_JSON_TS_B64" | base64 -d > "$site/functions/vizoalica/config.json.ts"
          echo "$INGEST_TOKEN_TS_B64" | base64 -d > "$site/functions/vizoalica/ingest-token.ts"
          echo "$VIZOALICA_LOADER_JS_B64" | base64 -d > "$site/vizoalica-loader.js"

      - name: Generate ephemeral Cloudflare Pages configuration
        env:
          VIZOALICA_SDK_SRC: ${{ vars.VIZOALICA_SDK_SRC }}
          VIZOALICA_INGEST_ENDPOINT: ${{ vars.VIZOALICA_INGEST_ENDPOINT }}
          VIZOALICA_PUBLIC_SOURCE_KEY: ${{ vars.VIZOALICA_PUBLIC_SOURCE_KEY }}
          VIZOALICA_PROJECT_ID: ${{ vars.VIZOALICA_PROJECT_ID }}
          VIZOALICA_TOKEN_URL: ${{ vars.VIZOALICA_TOKEN_URL }}
          VIZOALICA_CONSENT: ${{ vars.VIZOALICA_CONSENT }}
          VIZOALICA_SOURCE_ID: ${{ vars.VIZOALICA_SOURCE_ID }}
          VIZOALICA_SITE_ORIGIN: ${{ vars.VIZOALICA_SITE_ORIGIN }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          # This file exists only in the ephemeral CI workspace for this run.
          # It is never committed to the caller's repository.
          cat > "${{ inputs.site-directory }}/wrangler.toml" <<TOML
          name = "$CF_PAGES_PROJECT"
          pages_build_output_dir = "."
          compatibility_date = "2026-09-09"

          [vars]
          VIZOALICA_SDK_SRC = "$VIZOALICA_SDK_SRC"
          VIZOALICA_INGEST_ENDPOINT = "$VIZOALICA_INGEST_ENDPOINT"
          VIZOALICA_PUBLIC_SOURCE_KEY = "$VIZOALICA_PUBLIC_SOURCE_KEY"
          VIZOALICA_PROJECT_ID = "$VIZOALICA_PROJECT_ID"
          VIZOALICA_TOKEN_URL = "$VIZOALICA_TOKEN_URL"
          VIZOALICA_CONSENT = "$VIZOALICA_CONSENT"
          VIZOALICA_SOURCE_ID = "$VIZOALICA_SOURCE_ID"
          VIZOALICA_SITE_ORIGIN = "$VIZOALICA_SITE_ORIGIN"
          TOML

      - name: Set the ingest token signing secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          VIZOALICA_TOKEN_SECRET: ${{ secrets.VIZOALICA_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$VIZOALICA_TOKEN_SECRET" | npx --yes wrangler@4 pages secret put \
            VIZOALICA_TOKEN_SECRET --project-name "${{ vars.CF_PAGES_PROJECT }}"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy \
            --project-name "${{ vars.CF_PAGES_PROJECT }}" \
            --branch "${{ github.ref_name }}" \
            --cwd "${{ inputs.site-directory }}" \
            .
