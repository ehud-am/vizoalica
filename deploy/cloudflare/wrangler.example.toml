name = "vizoalica-ingest"
main = "../../apps/ingest-worker/src/index.ts"
compatibility_date = "2026-08-29"
# Keep variables set in the Cloudflare dashboard (for example the learning window below) when this
# configuration is deployed again.
keep_vars = true

[[d1_databases]]
binding = "VIZOALICA_DB"
database_name = "vizoalica-config"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "VIZOALICA_EVENTS"
bucket_name = "vizoalica-events"

[vars]
VIZOALICA_DEMO_MODE = "false"
VIZOALICA_MAX_REQUEST_BYTES = "131072"
# The release this Worker was deployed from; the console's deploy and update engines fill this in.
# Left blank for a hand-run `wrangler deploy`, which is fine: an unset version is treated as unknown.
VIZOALICA_WORKER_VERSION = ""
# Optional: how many different paths the no-script pixel counts per website (default 100). A value that
# is not a whole number of at least 1 is ignored. See docs/operations/pixel.md.
# VIZOALICA_PIXEL_MAX_PATHS = "100"
# Optional learning window: while it is open, a small share of page loads describe their pages (headings,
# landmarks, control and form-field labels; never values) so an assistant can learn the website's
# structure. Off unless VIZOALICA_LEARN_START is set. See docs/operations/spec.md.
# VIZOALICA_LEARN_START = "2026-12-01"   # first day, UTC
# VIZOALICA_LEARN_DAYS = "14"            # 1 to 90, default 14
# VIZOALICA_LEARN_SAMPLE = "10"          # percent of page loads, 1 to 100, default 10

# Optional edge throttle for POST /v1/events:batch, keyed per client address.
# Uncomment to enable; without it the Worker relies on per-source quotas only. `period` may
# be 10 or 60 seconds. `namespace_id` is any positive integer unique within your account.
# See docs/operations/cloudflare.md, "Ingest rate limiting".
# [[ratelimits]]
# name = "VIZOALICA_INGEST_LIMITER"
# namespace_id = "1001"
# [ratelimits.simple]
# limit = 120
# period = 60

[triggers]
crons = ["17 3 * * *"]
# Configure VIZOALICA_TOKEN_SECRET, VIZOALICA_ADMIN_SECRET, and
# VIZOALICA_ANALYTICS_DIGEST_SECRET with `wrangler secret put`.
