<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vizoalica basic SDK example</title>
  </head>
  <body>
    <button id="signup">Track signup click</button>
    <script type="module">
      import { init } from '../dist/index.js';

      const client = init({
        endpoint: 'http://localhost:4318/v1/events:batch',
        sourceKey: 'demo_source',
        projectId: 'demo_project',
        tokenProvider: async () => window.VIZOALICA_DEMO_TOKEN,
        consentState: 'analytics-granted'
      });

      document.getElementById('signup').addEventListener('click', () => {
        client.track('signup_click', { properties: { plan: 'demo' } });
      });
    </script>
  </body>
</html>
